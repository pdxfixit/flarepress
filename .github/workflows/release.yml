# Release flarepress: the tests on Linux and macOS (test.yml), then
# tools/release.sh --push: tag main as the next v1.M.P and move v1 to it.
# Started by hand or by automation: Actions → release → Run workflow,
# `just release [minor]`, or the API (workflow_dispatch). Only the tag job
# can write, and it runs no tests: the code it tags was tested read-only.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch for fixes, minor for something new a caller can use
        type: choice
        options: [patch, minor]
        default: patch
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  tag:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every tag, and the commits since the last release
      - name: Tag and move v1
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          tools/release.sh --push
      # A GitHub Release for the new tag, its notes from the tag message (the
      # Marketplace lists releases). Off for now: uncomment to make one each time.
